<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h2>DevSource Autofill Messages</h2>
        <div class="header-actions">
            <button class="settings-icon" id="quickFillBtn" title="Remplir">✍️</button>
            <button class="settings-icon" id="settingsBtn" title="Paramètres">⚙️</button>
        </div>
    </div>

    <div id="infoBox" class="info-box">
        <div class="no-info">Configure d'abord tes informations dans les paramètres</div>
    </div>

    <textarea id="message" placeholder="Message supplémentaire (optionnel)..."></textarea>
    <div class="button-group">
        <button id="fillBtn">Remplir le formulaire</button>
    </div>

    <div class="status" id="status"></div>

    <footer class="footer">
        <img src="../icons/logo-noir.png" alt="Logo DevSource" class="footer-logo">
        Copyright © 2026 Créé par
        <a href="https://www.devsource.fr" target="_blank">DevSource</a>
    </footer>
    <script src="popup.js"></script>
</body>
</html>
