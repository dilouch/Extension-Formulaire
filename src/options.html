<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres - Autofill Messages</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <div class="container">
        <h1>Mes Informations</h1>

        <form id="settingsForm">
            <div class="form-group">
                <label for="firstName">Prénom</label>
                <input type="text" id="firstName" placeholder="Ex: Jean" required>
            </div>

            <div class="form-group">
                <label for="lastName">Nom</label>
                <input type="text" id="lastName" placeholder="Ex: Dupont" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Ex: jean@example.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Téléphone</label>
                <input type="tel" id="phone" placeholder="Ex: +33 6 12 34 56 78">
            </div>

            <div class="form-group">
                <label for="subject">Sujet (optionnel)</label>
                <input type="text" id="subject" placeholder="Ex: Demande d'information">
            </div>

            <div class="form-group">
                <label for="message">Message par défaut</label>
                <textarea id="message" placeholder="Écris ton message par défaut ici..."></textarea>
            </div>

            <div class="button-group">
                <button type="submit" id="saveBtn">Enregistrer</button>
                <button type="button" id="resetBtn">Réinitialiser</button>
            </div>

            <div class="status" id="status"></div>
        </form>
    </div>

    <script src="options.js"></script>
</body>
</html>
